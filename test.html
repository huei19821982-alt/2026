<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>연결 시험</title>
<style>
:root{--bg:#f3f4f1;--paper:#fff;--ink:#1d2a33;--muted:#5d6a72;--line:#d9ddd6;--ok:#2d7a4f;--bad:#c2402c;--wait:#1f5f7a}
@media (prefers-color-scheme:dark){:root{--bg:#141a1e;--paper:#1c252b;--ink:#e6ebee;--muted:#9aa7ae;--line:#2f3b42;--ok:#6cc596;--bad:#ef7a63;--wait:#6fb3cf;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Apple SD Gothic Neo","Malgun Gothic",sans-serif;padding:32px 16px}
main{max-width:560px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:24px;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0}
ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
li{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:8px}
.st{font-weight:700;min-width:56px}
.ok .st{color:var(--ok)} .bad .st{color:var(--bad)} .wait .st{color:var(--wait)}
small{display:block;color:var(--muted)}
#result{font-weight:700;padding:12px;border-radius:8px;border:2px solid var(--line)}
</style>
</head>
<body>
<main>
  <h1>교육청 네트워크 연결 시험</h1>
  <p style="margin:0;color:var(--muted)">이 페이지를 <b>교육청 업무용 PC</b>에서 열어 주세요. 세 칸이 모두 '성공'이면 웹앱을 쓸 수 있어요.</p>
  <ol>
    <li id="s1" class="wait"><span class="st">확인 중</span><div>① Firebase 프로그램 불러오기<small>www.gstatic.com</small></div></li>
    <li id="s2" class="wait"><span class="st">대기</span><div>② 로그인 서버 연결<small>identitytoolkit.googleapis.com</small></div></li>
    <li id="s3" class="wait"><span class="st">대기</span><div>③ 데이터베이스 연결<small>firestore.googleapis.com</small></div></li>
  </ol>
  <div id="result">시험하는 중이에요…</div>
</main>
<script>
function mark(id,cls,txt,note){var el=document.getElementById(id);el.className=cls;el.querySelector(".st").textContent=txt;if(note){var s=document.createElement("small");s.textContent=note;el.querySelector("div").appendChild(s);}}
setTimeout(function(){ if(!window.__sdk){ mark("s1","bad","실패","Firebase 프로그램 주소가 막혀 있어요."); document.getElementById("result").textContent="연결 실패: www.gstatic.com 주소를 열어 달라고 정보화 담당 부서에 요청해야 해요."; } },12000);
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";
window.__sdk = true;
const res = document.getElementById("result");
mark("s1","ok","성공");
if(/여기에/.test(firebaseConfig.projectId)){ mark("s2","bad","설정 필요"); res.textContent="firebase-config.js에 설정값을 먼저 넣어 주세요."; throw 0; }
const app = initializeApp(firebaseConfig);
mark("s2","wait","확인 중");
try{ await signInAnonymously(getAuth(app)); mark("s2","ok","성공"); }
catch(e){
  const c=String(e.code||"");
  if(c.includes("operation-not-allowed")||c.includes("admin-restricted")){ mark("s2","bad","설정 필요","Firebase에서 익명 로그인이 꺼져 있어요."); res.textContent="연결은 되지만, Authentication → 로그인 방법에서 '익명'을 켜 주세요."; }
  else { mark("s2","bad","실패",c); res.textContent="연결 실패: identitytoolkit.googleapis.com 주소가 막혀 있을 수 있어요."; }
  throw e;
}
mark("s3","wait","확인 중");
try{
  // config/secret은 규칙상 읽을 수 없으므로 '권한 없음' 응답이 오면 서버까지 연결된 것
  await Promise.race([ getDoc(doc(getFirestore(app),"config","secret")), new Promise((_,r)=>setTimeout(()=>r({code:"timeout"}),15000)) ]);
  mark("s3","ok","성공","(주의) 보안 규칙이 아직 적용되지 않은 것 같아요.");
  res.textContent="세 단계 모두 연결됐어요! 단, 보안 규칙을 꼭 붙여 넣어 주세요.";
}catch(e){
  const c=String(e.code||"");
  if(c==="permission-denied"){ mark("s3","ok","성공"); res.textContent="✓ 세 단계 모두 성공! 교육청 네트워크에서 웹앱을 쓸 수 있어요."; res.style.borderColor="var(--ok)"; }
  else if(c.includes("not-found")||c.includes("failed-precondition")){ mark("s3","bad","설정 필요",c); res.textContent="연결은 되지만 Firestore 데이터베이스를 아직 만들지 않은 것 같아요."; }
  else { mark("s3","bad","실패",c); res.textContent="연결 실패: firestore.googleapis.com 주소가 막혀 있을 수 있어요."; }
}
</script>
</body>
</html>
